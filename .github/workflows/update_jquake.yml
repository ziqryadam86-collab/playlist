name: Auto Update JQuake Custom Path

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deno & yt-dlp
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "/home/runner/.deno/bin" >> $GITHUB_PATH
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup Cookies File
        env:
          COOKIES_DATA: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$COOKIES_DATA" > cookies.txt || true

      - name: Extract Live Stream to Custom Path
        run: |
          FOLDER_PATH="jquake/data/APaTxxMwRgIhALgUu290vdaHCwB10FLc_YmjvfDN7PuycubqzjkjSRMdAiEAo0gdem95tvsFz0GBsTx--dJmiKhlIQsp175JUMvVH0Y/playlist"
          mkdir -p "$FOLDER_PATH"
          
          TARGET_FILE="$FOLDER_PATH/index.m3u8"
          YT_URL="https://www.youtube.com/live/unVxJib34SI"
          OFFLINE_M3U8="https://raw.githubusercontent.com/MIFNtechnology/YtM3u8/github-private/assets/info.m3u8"

          # 1. Dapatkan HLS Live Manifest yang sah dari YouTube
          STREAM_URL=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f "hls-meta/b/best" "$YT_URL" 2>/dev/null | grep "manifest.googlevideo.com" | head -n 1 || true)

          # Jika hls-meta tidak dijumpai, cuba format gabungan langsung
          if [ -z "$STREAM_URL" ]; then
            STREAM_URL=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f "95/94/93/best" "$YT_URL" 2>/dev/null | head -n 1 || true)
          fi

          # 2. Tulis struktur HLS Live Master yang paksa player baca sebagai LIVE STREAM
          if [ -n "$STREAM_URL" ] && case "$STREAM_URL" in http*) true;; *) false;; esac; then
            echo "Menjana HLS Live Playlist..."
            {
              echo "#EXTM3U"
              echo "#EXT-X-VERSION:3"
              echo "#EXT-X-INDEPENDENT-SEGMENTS"
              echo '#EXT-X-STREAM-INF:BANDWIDTH=2500000,RESOLUTION=1280x720,CODECS="avc1.4d401f,mp4a.40.2"'
              echo "$STREAM_URL"
            } > "$TARGET_FILE"
          else
            echo "Stream offline, menggunakan Fallback..."
            {
              echo "#EXTM3U"
              echo "#EXT-X-VERSION:3"
              echo '#EXT-X-STREAM-INF:BANDWIDTH=1400000,RESOLUTION=854x480'
              echo "$OFFLINE_M3U8"
            } > "$TARGET_FILE"
          fi

      - name: Safe Commit and Push to Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update JQuake Master Index M3U8 [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push || true
          
