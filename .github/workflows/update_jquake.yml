name: Auto Update JQuake Custom Path

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deno & yt-dlp
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "/home/runner/.deno/bin" >> $GITHUB_PATH
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup Cookies File
        env:
          COOKIES_DATA: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$COOKIES_DATA" > cookies.txt || true

      - name: Extract Live Stream to Custom Path
        run: |
          # Bina direktori/folder berlapis
          FOLDER_PATH="jquake/data/APaTxxMwRgIhALgUu290vdaHCwB10FLc_YmjvfDN7PuycubqzjkjSRMdAiEAo0gdem95tvsFz0GBsTx--dJmiKhlIQsp175JUMvVH0Y/playlist"
          mkdir -p "$FOLDER_PATH"
          
          TARGET_FILE="$FOLDER_PATH/index.m3u8"
          YT_URL="https://www.youtube.com/live/unVxJib34SI"
          OFFLINE_M3U8="https://raw.githubusercontent.com/MIFNtechnology/YtM3u8/github-private/assets/info.m3u8"

          # Ekstrak HLS Live URL
          STREAM_URL=$(yt-dlp --cookies cookies.txt --js-runtimes deno -g -f "best[protocol=m3u8_native]/b" "$YT_URL" 2>/dev/null | head -n 1 || true)

          # Tulis kandungan m3u8
          if [ -n "$STREAM_URL" ] && case "$STREAM_URL" in http*) true;; *) false;; esac; then
            echo "#EXTM3U" > "$TARGET_FILE"
            echo "#EXT-X-VERSION:3" >> "$TARGET_FILE"
            echo '#EXT-X-STREAM-INF:BANDWIDTH=1400000,RESOLUTION=854x480' >> "$TARGET_FILE"
            echo "$STREAM_URL" >> "$TARGET_FILE"
          else
            echo "#EXTM3U" > "$TARGET_FILE"
            echo "#EXT-X-VERSION:3" >> "$TARGET_FILE"
            echo '#EXT-X-STREAM-INF:BANDWIDTH=1400000,RESOLUTION=854x480' >> "$TARGET_FILE"
            echo "$OFFLINE_M3U8" >> "$TARGET_FILE"
          fi

      - name: Safe Commit and Push to Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update JQuake custom path playlist [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push || true
          
